name: Validate SDK project
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check dependencies and Git LFS rules
        run: python Tools/project.py check --pointers
      - name: Test packaging integrity
        run: python -m unittest discover -s Tools/tests -v

